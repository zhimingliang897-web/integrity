# CourseDigest 配置文件

# 路径配置
input_dir: "input"
cache_dir: "cache"
output_dir: "output"

# 语音转文字配置
whisper:
  engine: "faster"      # faster（稳定）或 fast（快10倍，需 pip install insanely-fast-whisper）
  model: "small"        # tiny/base/small/medium
  device: "cpu"         # cuda 或 cpu
  compute_type: "int8"  # int8/float16
  language: "en"
  beam_size: 1

# API 配置
api:
  provider: "dashscope"
  api_key: "sk-0ef56d1b3ba54a188ce28a46c54e2a24"
  model: "glm-5"

# 分析配置
analysis:
  chunk_minutes: 30
  temperature: 0.3
  max_tokens: 4096