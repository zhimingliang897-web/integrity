<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人文件系统 - 设置</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161922;
            --surface2: #1e2230;
            --border: #2a2f42;
            --accent: #6c63ff;
            --text: #e8eaf0;
            --text-dim: #8892a4;
            --success: #4ecdc4;
            --error: #ff6b6b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 30px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 16px; font-weight: 500; margin-bottom: 20px; color: var(--text); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
        input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        .btn {
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #5a52d5; }
        .btn.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .btn.ghost:hover { border-color: var(--accent); color: var(--text); }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .msg { font-size: 13px; margin-top: 15px; padding: 10px; border-radius: 8px; }
        .msg.success { background: #4ecdc420; color: var(--success); }
        .msg.error { background: #ff6b6b20; color: var(--error); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ 系统设置</h1>
        
        <div class="card">
            <h2>📂 存储路径配置</h2>
            <div class="form-group">
                <label for="root-path">主目录 Root</label>
                <input type="text" id="root-path" placeholder="F:\MyFiles">
            </div>
            <div class="form-group">
                <label for="uploads-path">上传目录</label>
                <input type="text" id="uploads-path" placeholder="F:\MyFiles\uploads">
            </div>
            <div class="form-group">
                <label for="trash-path">回收站目录</label>
                <input type="text" id="trash-path" placeholder="F:\MyFiles\.trash">
            </div>
            <div class="form-group">
                <label for="max-upload-size">上传文件大小限制 (MB)</label>
                <input type="number" id="max-upload-size" placeholder="2048" min="1">
            </div>
        </div>
        
        <div class="card">
            <h2>🔐 登录密码</h2>
            <div class="form-group">
                <label for="password">新密码</label>
                <input type="password" id="password" placeholder="输入新密码">
            </div>
        </div>
        
        <div class="card">
            <h2>🤖 LLM 配置 (阿里百炼) <span id="llm-status" class="status-badge"></span></h2>
            <div class="form-group">
                <label for="llm-api-key">API Key（不填则保留原值）</label>
                <input type="text" id="llm-api-key" placeholder="sk-xxxxxx">
            </div>
            <div class="form-group">
                <label for="llm-model">模型名称</label>
                <input type="text" id="llm-model" placeholder="qwen-plus">
            </div>
            <div class="form-group">
                <label for="llm-base-url">API Base URL（兼容 OpenAI 格式）</label>
                <input type="text" id="llm-base-url" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
            </div>
            <div class="form-group">
                <label for="llm-model-display" style="font-size:12px;color:var(--text-dim)">获取 Key：<a href="https://dashscope.console.aliyun.com/apiKey" target="_blank">DashScope 控制台</a></label>
            </div>
            <div class="actions" style="margin-top:0">
                <button class="btn ghost" onclick="testLLM()">🔌 测试连接</button>
            </div>
            <div class="msg" id="llm-test-msg" style="display:none;"></div>
        </div>
        
        <div class="card">
            <h2>🌐 内网穿透 (Natapp)</h2>
            <div class="form-group">
                <label for="natapp-token">Authtoken</label>
                <input type="text" id="natapp-token" placeholder="输入 natapp authtoken">
            </div>
        </div>
        
        <div class="card">
            <h2>📧 邮箱配置 (用于发送文件) <span id="email-status" class="status-badge"></span></h2>
            <div class="form-group">
                <label for="email-sender">发件邮箱</label>
                <input type="email" id="email-sender" placeholder="your@qq.com">
            </div>
            <div class="form-group">
                <label for="email-password">邮箱授权码（QQ邮箱16位，不填则保留原值）</label>
                <input type="password" id="email-password" placeholder="留空则不修改">
            </div>
            <div class="form-group">
                <label for="email-test-recipient" style="font-size:12px;">测试收件邮箱</label>
                <input type="email" id="email-test-recipient" placeholder="发一封测试邮件到此地址">
            </div>
            <div class="actions" style="margin-top:0">
                <button class="btn ghost" onclick="testEmail()">📨 发送测试邮件</button>
            </div>
            <div class="msg" id="email-test-msg" style="display:none;"></div>
        </div>
        

        <div class="card">
            <h2>Mounts Manager</h2>
            <div class="actions">
                <a href="/mounts" class="btn">Open Mounts UI</a>
                <a href="/" class="btn ghost">Back to MyFiles</a>
            </div>
        </div>
        <div class="actions">
            <button class="btn" id="save-btn">保存设置</button>
            <a href="/" class="btn ghost">返回首页</a>
        </div>
        <div class="msg" id="msg" style="display:none;"></div>
    </div>
    
    <style>
        .status-badge { font-size: 13px; font-weight: 400; margin-left: 8px; }
        .status-ok { color: #4ecdc4; }
        .status-no { color: #ff6b6b; }
    </style>
    <script>
        function setStatusBadge(id, configured) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = configured ? '✅ 已配置' : '❌ 未配置';
            el.className = 'status-badge ' + (configured ? 'status-ok' : 'status-no');
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data.root_path) document.getElementById('root-path').value = data.root_path;
                if (data.uploads_path) document.getElementById('uploads-path').value = data.uploads_path;
                if (data.trash_path) document.getElementById('trash-path').value = data.trash_path;
                if (data.max_upload_size_mb) document.getElementById('max-upload-size').value = data.max_upload_size_mb;
                if (data.llm_model) document.getElementById('llm-model').value = data.llm_model;
                if (data.llm_base_url) document.getElementById('llm-base-url').value = data.llm_base_url;
                if (data.natapp_configured) document.getElementById('natapp-token').placeholder = '（已配置，留空保留原值）';
                if (data.email_configured) document.getElementById('email-sender').placeholder = '（已配置，留空保留原值）';
                setStatusBadge('llm-status', data.llm_configured);
                setStatusBadge('email-status', data.email_configured);
            } catch (e) {
                console.error('Load config failed:', e);
            }
        }

        async function testLLM() {
            const msgEl = document.getElementById('llm-test-msg');
            msgEl.textContent = '正在测试...';
            msgEl.className = 'msg';
            msgEl.style.display = 'block';
            try {
                const res = await fetch('/api/agent/test');
                const data = await res.json();
                msgEl.textContent = data.message;
                msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
            } catch (e) {
                msgEl.textContent = '测试请求失败：' + e.message;
                msgEl.className = 'msg error';
            }
        }

        async function testEmail() {
            const recipient = document.getElementById('email-test-recipient').value.trim();
            if (!recipient) {
                alert('请填写测试收件邮箱');
                return;
            }
            const msgEl = document.getElementById('email-test-msg');
            msgEl.textContent = '正在发送测试邮件...';
            msgEl.className = 'msg';
            msgEl.style.display = 'block';
            try {
                const formData = new FormData();
                formData.append('paths', '');
                formData.append('recipient', recipient);
                formData.append('test_only', 'true');
                const res = await fetch('/api/files/email/test', {
                    method: 'POST',
                    body: JSON.stringify({ recipient }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                msgEl.textContent = data.message || (res.ok ? '✅ 测试邮件已发送' : '❌ 发送失败');
                msgEl.className = 'msg ' + (res.ok ? 'success' : 'error');
            } catch (e) {
                msgEl.textContent = '测试请求失败：' + e.message;
                msgEl.className = 'msg error';
            }
        }

        loadConfig();
        
        document.getElementById('save-btn').addEventListener('click', async () => {
            const msg = document.getElementById('msg');
            msg.style.display = 'none';
            
            const data = {};
            
            const rootPath = document.getElementById('root-path').value.trim();
            const uploadsPath = document.getElementById('uploads-path').value.trim();
            const trashPath = document.getElementById('trash-path').value.trim();
            const maxUploadSize = document.getElementById('max-upload-size').value.trim();
            
            if (rootPath) data.root_path = rootPath;
            if (uploadsPath) data.uploads_path = uploadsPath;
            if (trashPath) data.trash_path = trashPath;
            if (maxUploadSize) data.max_upload_size_mb = parseInt(maxUploadSize);
            
            const password = document.getElementById('password').value;
            if (password) data.password = password;
            
            const llmApiKey = document.getElementById('llm-api-key').value;
            if (llmApiKey) data.llm_api_key = llmApiKey;
            const llmModel = document.getElementById('llm-model').value.trim();
            if (llmModel) data.llm_model = llmModel;
            const llmBaseUrl = document.getElementById('llm-base-url').value.trim();
            if (llmBaseUrl) data.llm_base_url = llmBaseUrl;
            
            const natappToken = document.getElementById('natapp-token').value;
            if (natappToken) data.natapp_token = natappToken;
            
            const emailSender = document.getElementById('email-sender').value;
            const emailPassword = document.getElementById('email-password').value;
            if (emailSender) data.email_sender = emailSender;
            if (emailPassword) data.email_password = emailPassword;
            
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                msg.textContent = result.message || '保存成功';
                msg.className = 'msg success';
                msg.style.display = 'block';
                
                document.getElementById('password').value = '';
                document.getElementById('llm-api-key').value = '';
                document.getElementById('natapp-token').value = '';
                document.getElementById('email-password').value = '';

                loadConfig();
            } catch (e) {
                msg.textContent = '保存失败: ' + e.message;
                msg.className = 'msg error';
                msg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
